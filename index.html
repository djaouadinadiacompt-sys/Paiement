<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    .card-header { text-align: center; margin-bottom: 28px; }
    .card-header h1 { font-size: 1.5rem; color: #1a73e8; margin-bottom: 4px; }
    .card-header p { color: #888; font-size: 0.9rem; }
    .form-group { margin-bottom: 18px; position: relative; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; color: #333;
      transition: border-color 0.2s; background: #fafafa;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #1a73e8; background: white;
    }
    textarea { resize: vertical; min-height: 80px; }
    #referenceGroup, #factureGroup, #photoGroup { display: none; }
    #suggestions, #factureSuggestions {
      border: 1.5px solid #ddd; border-top: none;
      border-radius: 0 0 8px 8px; background: white;
      max-height: 200px; overflow-y: auto; display: none;
      position: absolute; width: 100%; z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #suggestions div, #factureSuggestions div { padding: 10px 14px; cursor: pointer; font-size: 0.95rem; color: #333; }
    #suggestions div:hover, #suggestions div.active,
    #factureSuggestions div:hover, #factureSuggestions div.active { background: #e8f0fe; color: #1a73e8; }
    .btn {
      width: 100%; padding: 13px; background: #1a73e8; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    .btn:hover { background: #1558b0; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 0.9rem; display: none; }
    .alert.success { background: #e6f4ea; color: #2e7d32; border: 1px solid #a8d5b0; }
    .alert.error   { background: #fdecea; color: #c62828; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>💳 Saisie Paiement</h1>
    <p>Enregistrement d'un règlement client</p>
  </div>
  <div class="form-group">
    <label for="date">Date *</label>
    <input type="date" id="date" required>
  </div>
  <div class="form-group">
    <label for="client">Client *</label>
    <input type="text" id="client" placeholder="Tapez pour rechercher..." autocomplete="off" required>
    <div id="suggestions"></div>
    <div style="text-align:right; margin-top:4px;">
      <a href="#" id="lienImportClients" style="font-size:0.8rem; color:#1a73e8; text-decoration:none;">📋 Importer une liste de secours</a>
    </div>
  </div>
  <div class="form-group">
    <label for="montant">Montant (DZD) *</label>
    <input type="number" id="montant" placeholder="0.00" min="0" step="0.01" required>
  </div>
  <div class="form-group">
    <label for="mode">Mode de paiement *</label>
    <select id="mode" onchange="toggleReference(this.value)">
      <option value="">-- Sélectionner --</option>
      <option value="Espèces">Espèces</option>
      <option value="Virement">Virement bancaire</option>
      <option value="Versement">Versement</option>
      <option value="Chèque">Chèque</option>
    </select>
  </div>
  <div class="form-group" id="referenceGroup">
    <label for="numeroCheque" id="referenceLabel">N° Chèque *</label>
    <input type="text" id="numeroCheque" placeholder="Ex: 001234">
  </div>
  <div class="form-group" id="factureGroup">
    <label for="numeroFacture">N° Facture *</label>
    <input type="text" id="numeroFacture" placeholder="Ex: FA20260001" autocomplete="off">
    <div id="factureSuggestions"></div>
  </div>
  <div class="form-group" id="photoGroup">
    <label for="photo">Photo du justificatif (optionnel)</label>
    <input type="file" id="photo" accept="image/*" capture="environment">
    <div id="photoPreviewWrap" style="display:none; margin-top:10px;">
      <img id="photoPreview" style="max-width:100%; border-radius:8px; border:1.5px solid #ddd;">
    </div>
  </div>
  <div class="form-group">
    <label for="commentaire">Commentaire</label>
    <textarea id="commentaire" placeholder="Note ou observation..."></textarea>
  </div>
  <button class="btn" id="btnSoumettre" onclick="soumettre()">✅ Enregistrer le paiement</button>
  <div class="alert" id="alertMsg"></div>
</div>

<div id="importOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:24px; width:90%; max-width:420px;">
    <h2 style="font-size:1.1rem; margin-bottom:8px; color:#1a73e8;">Importer une liste de clients</h2>
    <p style="font-size:0.85rem; color:#666; margin-bottom:12px;">Colle un nom de client par ligne (copié depuis ton fichier Sheets par exemple).</p>
    <textarea id="importTextarea" style="width:100%; min-height:160px; border:1.5px solid #ddd; border-radius:8px; padding:10px; font-size:0.9rem;" placeholder="Nom Client 1&#10;Nom Client 2&#10;Nom Client 3..."></textarea>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button onclick="fermerImport()" style="flex:1; padding:10px; border-radius:8px; border:1.5px solid #ddd; background:white; cursor:pointer;">Annuler</button>
      <button onclick="validerImport()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#1a73e8; color:white; cursor:pointer; font-weight:600;">Utiliser cette liste</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwA4uAQU639qjrhC9liyxEq2H1mMr_4bAlS9JUBBep8I4dw1qPbXGWBzeSqMCE4JkxO/exec";
  const PROXY   = "https://corsproxy.io/?";
  const IMGBB_API_KEY = "adc6b237a9ad9924c2b096a52f980bf1";

  function uploadPhotoImgBB(file) {
    const formData = new FormData();
    formData.append("image", file);
    return fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
      method: "POST",
      body: formData
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) return data.data.url;
      throw new Error("Échec de l'upload de la photo.");
    });
  }

  function resetPhoto() {
    const photoInput = document.getElementById("photo");
    const previewWrap = document.getElementById("photoPreviewWrap");
    photoInput.value = "";
    previewWrap.style.display = "none";
  }

  document.getElementById("photo").addEventListener("change", function() {
    const file = this.files[0];
    const previewWrap = document.getElementById("photoPreviewWrap");
    const preview = document.getElementById("photoPreview");
    if (!file) { previewWrap.style.display = "none"; return; }
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      previewWrap.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  // Libellés du champ référence selon le mode de paiement
  const REFERENCE_LABELS = {
    "Chèque":   "N° Chèque *",
    "Virement": "N° Virement *",
    "Versement":"N° Versement *"
  };
  const REFERENCE_PLACEHOLDERS = {
    "Chèque":   "Ex: 001234",
    "Virement": "Ex: VIR-2026-001",
    "Versement":"Ex: VER-2026-001"
  };
  // Modes pour lesquels le champ référence est obligatoire
  const MODES_AVEC_REFERENCE = ["Chèque", "Virement", "Versement"];

  const PROXIES = [
    "https://corsproxy.io/?",
    "https://api.allorigins.win/raw?url="
  ];

  function callGET(params, tentative) {
    tentative = tentative || 0;
    const url = API_URL + "?" + new URLSearchParams(params).toString();
    const proxy = PROXIES[tentative % PROXIES.length];
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    return fetch(proxy + encodeURIComponent(url), { signal: controller.signal })
      .then(r => {
        clearTimeout(timeoutId);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .catch(err => {
        clearTimeout(timeoutId);
        if (tentative < 3) {
          // Nouvelle tentative (jusqu'à 4 essais au total, en alternant les proxys)
          return new Promise(resolve => setTimeout(resolve, 600))
            .then(() => callGET(params, tentative + 1));
        }
        throw err;
      });
  }

  document.getElementById("date").valueAsDate = new Date();
  let tousLesClients = [];
  let toutesLesFactures = [];

  function chargerClients() {
    callGET({ action: "getClients" })
      .then(data => {
        if (data.success) {
          tousLesClients = data.clients;
          console.log("✅ Clients chargés :", tousLesClients.length);
          try { localStorage.setItem("cache_clients", JSON.stringify(tousLesClients)); } catch(e) {}
        } else {
          throw new Error("Réponse invalide du serveur");
        }
      })
      .catch(err => {
        console.error("❌ Erreur chargement clients :", err);
        let cache = [];
        try { cache = JSON.parse(localStorage.getItem("cache_clients") || "[]"); } catch(e) {}
        if (cache.length > 0) {
          tousLesClients = cache;
          showAlert("error", "⚠️ Connexion instable : liste de clients (dernière version enregistrée) utilisée.");
        } else {
          showAlert("error", "⚠️ Impossible de charger la liste des clients (connexion). Tape sur le champ Client pour réessayer.");
        }
      });
  }

  function chargerFactures() {
    callGET({ action: "getFactures" })
      .then(data => {
        if (data.success) {
          toutesLesFactures = data.factures;
          console.log("✅ Factures chargées :", toutesLesFactures.length);
          try { localStorage.setItem("cache_factures", JSON.stringify(toutesLesFactures)); } catch(e) {}
        }
      })
      .catch(err => {
        console.error("❌ Erreur chargement factures :", err);
        let cache = [];
        try { cache = JSON.parse(localStorage.getItem("cache_factures") || "[]"); } catch(e) {}
        if (cache.length > 0) toutesLesFactures = cache;
      });
  }

  chargerClients();
  chargerFactures();

  document.getElementById("lienImportClients").addEventListener("click", function(e) {
    e.preventDefault();
    document.getElementById("importTextarea").value = tousLesClients.join("\n");
    document.getElementById("importOverlay").style.display = "flex";
  });

  function fermerImport() {
    document.getElementById("importOverlay").style.display = "none";
  }

  function validerImport() {
    const texte = document.getElementById("importTextarea").value;
    const liste = texte.split("\n").map(l => l.trim()).filter(l => l.length > 0).sort();
    if (liste.length === 0) {
      showAlert("error", "⚠️ La liste collée est vide.");
      return;
    }
    tousLesClients = liste;
    try { localStorage.setItem("cache_clients", JSON.stringify(tousLesClients)); } catch(e) {}
    fermerImport();
    showAlert("success", "✅ Liste de " + liste.length + " client(s) importée et sauvegardée.");
  }

  const inputClient = document.getElementById("client");
  const suggestions = document.getElementById("suggestions");

  inputClient.addEventListener("input", function() {
    if (tousLesClients.length === 0) chargerClients();
    const val = this.value.trim().toLowerCase();
    suggestions.innerHTML = "";
    suggestions.style.display = "none";
    if (val.length === 0) return;
    const filtres = tousLesClients.filter(c => c.toLowerCase().includes(val));
    if (filtres.length === 0) return;
    filtres.forEach(function(nom) {
      const div = document.createElement("div");
      const regex = new RegExp("(" + val + ")", "gi");
      div.innerHTML = nom.replace(regex, "<strong>$1</strong>");
      div.addEventListener("mousedown", function() {
        inputClient.value = nom;
        suggestions.style.display = "none";
      });
      suggestions.appendChild(div);
    });
    suggestions.style.display = "block";
  });

  document.addEventListener("click", function(e) {
    if (e.target !== inputClient) suggestions.style.display = "none";
    if (e.target !== inputFacture) factureSuggestions.style.display = "none";
  });

  const inputFacture = document.getElementById("numeroFacture");
  const factureSuggestions = document.getElementById("factureSuggestions");

  inputFacture.addEventListener("input", function() {
    const val = this.value.trim().toLowerCase();
    factureSuggestions.innerHTML = "";
    factureSuggestions.style.display = "none";
    if (val.length === 0) return;
    const filtres = toutesLesFactures.filter(f => f.toLowerCase().includes(val));
    if (filtres.length === 0) return;
    filtres.forEach(function(num) {
      const div = document.createElement("div");
      const regex = new RegExp("(" + val + ")", "gi");
      div.innerHTML = num.replace(regex, "<strong>$1</strong>");
      div.addEventListener("mousedown", function() {
        inputFacture.value = num;
        factureSuggestions.style.display = "none";
      });
      factureSuggestions.appendChild(div);
    });
    factureSuggestions.style.display = "block";
  });

  function toggleReference(val) {
    const group = document.getElementById("referenceGroup");
    const label = document.getElementById("referenceLabel");
    const input = document.getElementById("numeroCheque");
    const factureGroup = document.getElementById("factureGroup");
    const factureInput = document.getElementById("numeroFacture");
    const photoGroup = document.getElementById("photoGroup");
    const doitAfficher = MODES_AVEC_REFERENCE.includes(val);

    group.style.display = doitAfficher ? "block" : "none";
    input.required = doitAfficher;
    factureGroup.style.display = doitAfficher ? "block" : "none";
    factureInput.required = doitAfficher;
    photoGroup.style.display = doitAfficher ? "block" : "none";

    if (doitAfficher) {
      label.textContent = REFERENCE_LABELS[val];
      input.placeholder = REFERENCE_PLACEHOLDERS[val];
    } else {
      input.value = "";
      factureInput.value = "";
      resetPhoto();
    }
  }

  function showAlert(type, msg) {
    const el = document.getElementById("alertMsg");
    el.className = "alert " + type;
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 5000);
  }

  function resetForm() {
    document.getElementById("date").valueAsDate = new Date();
    document.getElementById("client").value = "";
    document.getElementById("montant").value = "";
    document.getElementById("mode").value = "";
    document.getElementById("numeroCheque").value = "";
    document.getElementById("numeroFacture").value = "";
    document.getElementById("commentaire").value = "";
    document.getElementById("referenceGroup").style.display = "none";
    document.getElementById("factureGroup").style.display = "none";
    resetPhoto();
  }

  function soumettre() {
    const date         = document.getElementById("date").value;
    const client       = document.getElementById("client").value.trim();
    const montant      = document.getElementById("montant").value;
    const mode         = document.getElementById("mode").value;
    const numeroCheque = document.getElementById("numeroCheque").value.trim();
    const numeroFacture= document.getElementById("numeroFacture").value.trim();
    const commentaire  = document.getElementById("commentaire").value.trim();

    if (!date || !client || !montant || !mode) {
      showAlert("error", "⚠️ Veuillez remplir tous les champs obligatoires (*).");
      return;
    }
    if (parseFloat(montant) <= 0) {
      showAlert("error", "⚠️ Le montant doit être supérieur à 0.");
      return;
    }
    if (MODES_AVEC_REFERENCE.includes(mode) && !numeroCheque) {
      showAlert("error", "⚠️ Veuillez saisir le " + REFERENCE_LABELS[mode].replace(" *", "") + ".");
      return;
    }
    if (MODES_AVEC_REFERENCE.includes(mode) && !numeroFacture) {
      showAlert("error", "⚠️ Veuillez saisir le N° Facture.");
      return;
    }
    if (!tousLesClients.includes(client)) {
      showAlert("error", "⚠️ Client introuvable. Sélectionnez un client dans la liste.");
      return;
    }

    const btn = document.getElementById("btnSoumettre");
    btn.disabled = true;
    btn.textContent = "⏳ Enregistrement...";

    const photoFile = document.getElementById("photo").files[0];

    const envoyerPaiement = (photoUrl) => {
      callGET({
        action: "ajouterPaiement",
        client, montant, date, mode,
        numeroCheque: numeroCheque || "",
        numeroFacture: numeroFacture || "",
        commentaire: commentaire || "",
        photoUrl: photoUrl || ""
      })
      .then(data => {
        if (data.success) {
          showAlert("success", "✅ Paiement enregistré avec succès !");
          resetForm();
        } else {
          showAlert("error", "❌ Erreur : " + data.error);
        }
        btn.disabled = false;
        btn.textContent = "✅ Enregistrer le paiement";
      })
      .catch(err => {
        showAlert("error", "❌ Erreur réseau : " + err.message);
        btn.disabled = false;
        btn.textContent = "✅ Enregistrer le paiement";
      });
    };

    if (photoFile) {
      btn.textContent = "⏳ Envoi de la photo...";
      uploadPhotoImgBB(photoFile)
        .then(url => {
          btn.textContent = "⏳ Enregistrement...";
          envoyerPaiement(url);
        })
        .catch(err => {
          showAlert("error", "❌ " + err.message);
          btn.disabled = false;
          btn.textContent = "✅ Enregistrer le paiement";
        });
    } else {
      envoyerPaiement("");
    }
  }
</script>
</body>
</html>
